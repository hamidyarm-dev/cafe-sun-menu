<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://thdygopdekrsvlaiqenn.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_aakpKysdCimEdOT4tJpEg_vx2e8jG3';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let cart = [];


/* =================================================
   محصولات پیش‌فرض فعلی سایت
   این بخش فعلاً دست‌نخورده می‌ماند
   تا زمانی که جدول Supabase خالی است.
   ================================================= */

const defaultProducts = [

  {name:'اسپرسو سینگل',price:90000},
  {name:'دبل',price:120000},
  {name:'آمریکانو',price:120000},
  {name:'کاپوچینو',price:140000},
  {name:'لاته',price:150000},
  {name:'موکا',price:170000},

  {name:'آیس آمریکانو',price:120000},
  {name:'آیس لاته',price:150000},
  {name:'آفوگاتو',price:160000},

  {name:'چای',price:70000},
  {name:'دمنوش',price:110000},
  {name:'ماسالا',price:150000},
  {name:'هات چاکلت',price:160000},

  {name:'لیموناد',price:150000},
  {name:'موهیتو',price:160000},
  {name:'شیرموز',price:180000},

  {name:'شیک شکلات',price:190000},
  {name:'شیک موز شکلات',price:210000},
  {name:'شیک نوتلا',price:240000},

  {name:'چیزبرگر',price:350000},
  {name:'پاستا آلفردو مرغ',price:370000},
  {name:'ماشروم چیزبرگر',price:390000},

  {name:'سیب زمینی مخصوص',price:175000},
  {name:'نان سیر',price:130000},

  {name:'سالاد سزار با مرغ',price:290000},

  {name:'کیک شکلاتی',price:150000},
  {name:'چیزکیک',price:180000},
  {name:'تیرامیسو',price:200000},
  {name:'براونی با بستنی',price:210000},
  {name:'کوکی شکلاتی',price:90000}

];


/* =================================================
   تبدیل عدد به فارسی
   ================================================= */

function faNumber(number){

  return new Intl.NumberFormat('fa-IR')
    .format(number);

}


/* =================================================
   نمایش قیمت
   ================================================= */

function priceText(price){

  return faNumber(price) + ' تومان';

}


/* =================================================
   افکت انتخاب هات اسپات
   ================================================= */

function hotspotEffect(element){

  if(!element){
    return;
  }

  element.classList.remove('selected');

  void element.offsetWidth;

  element.classList.add('selected');

  setTimeout(function(){

    element.classList.remove('selected');

  },1000);

}


/* =================================================
   افزودن محصول
   ================================================= */

function addToCart(name,price){

  const existing =
    cart.find(
      item => item.name === name
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:name,
      price:Number(price),
      qty:1

    });

  }


  if(window.event){

    hotspotEffect(
      window.event.currentTarget
    );

  }


  updateCart();

  showToast(
    name + ' به سبد اضافه شد ✓'
  );

}


/* =================================================
   تغییر تعداد
   ================================================= */

function changeQty(index,change){

  cart[index].qty += change;


  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  updateCart();

}


/* =================================================
   بروزرسانی سبد
   ================================================= */

function updateCart(){

  const container =
    document.getElementById(
      'cartItems'
    );


  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  document.getElementById(
    'cartCount'
  ).textContent =
    faNumber(count);


  if(cart.length === 0){

    container.innerHTML =
      '<div class="empty-cart">' +
      'سبد سفارش خالی است.' +
      '</div>';


    document.getElementById(
      'cartTotal'
    ).textContent =
      'مجموع: ۰ تومان';


    return;

  }


  container.innerHTML = '';

  let total = 0;


  cart.forEach(
    (item,index)=>{

      total +=
        Number(item.price) *
        item.qty;


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'cart-item';


      row.innerHTML = `

        <div>

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-price">
            ${priceText(item.price)}
          </div>

        </div>


        <div class="quantity">

          <button
            onclick="changeQty(${index},1)">
            +
          </button>

          <span>
            ${faNumber(item.qty)}
          </span>

          <button
            onclick="changeQty(${index},-1)">
            −
          </button>

        </div>

      `;


      container.appendChild(row);

    }
  );


  document.getElementById(
    'cartTotal'
  ).textContent =
    'مجموع: ' +
    priceText(total);

}


/* =================================================
   باز کردن سبد
   ================================================= */

function openCart(){

  updateCart();

  document.getElementById(
    'cartOverlay'
  ).style.display =
    'block';

}


/* =================================================
   بستن سبد
   ================================================= */

function closeCart(){

  document.getElementById(
    'cartOverlay'
  ).style.display =
    'none';

}


/* =================================================
   پیام
   ================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.style.display =
    'block';


  setTimeout(
    ()=>{

      toast.style.display =
        'none';

    },
    1500
  );

}


/* =================================================
   خواندن محصولات از Supabase
   ================================================= */

async function loadProductsFromSupabase(){

  try{

    const {data,error} =
      await supabaseClient
        .from('کافه پروداکت')
        .select(`
          id,
          category_id,
          name,
          description,
          price,
          active,
          sort_order,
          hotspot_top,
          hotspot_right,
          hotspot_width,
          hotspot_height,
          image_product,
          created_at,
          updated_at
        `)
        .eq('active',true)
        .order('sort_order',{
          ascending:true
        });


    if(error){

      console.warn(
        'Supabase product query:',
        error.message
      );

      return;

    }


    /*
      فعلاً اگر جدول خالی باشد هیچ تغییری
      در منوی سالم فعلی ایجاد نمی‌کنیم.
    */

    if(!data || data.length === 0){

      console.log(
        'Supabase connected. Product table is empty.'
      );

      return;

    }


    /*
      اگر بعداً محصولات وارد جدول شوند،
      قیمت و نام محصول موجود در جدول می‌تواند
      جایگزین اطلاعات فعلی همان محصول شود.
    */

    data.forEach(product => {

      const name =
        product.name;

      const price =
        Number(product.price);


      if(!name || !Number.isFinite(price)){
        return;
      }


      /*
        پیدا کردن دکمه‌هایی که محصول فعلی
        را در onclick دارند.
      */

      const buttons =
        document.querySelectorAll(
          '.hotspot'
        );


      buttons.forEach(button => {

        const onclick =
          button.getAttribute(
            'onclick'
          );


        if(!onclick){
          return;
        }


        if(
          onclick.includes(
            "'" + name + "'"
          )
        ){

          button.setAttribute(
            'onclick',
            `addToCart(${JSON.stringify(name)},${price})`
          );

        }

      });

    });


    console.log(
      'Supabase products loaded:',
      data.length
    );

  }catch(error){

    console.warn(
      'Supabase connection error:',
      error
    );

  }

}


/* =================================================
   تأیید سفارش
   ================================================= */

function confirmOrder(){

  if(cart.length === 0){

    alert(
      'سبد سفارش خالی است.'
    );

    return;

  }


  alert(
    'سبد سفارش تأیید شد.\n\n' +
    'اتصال محصولات به Supabase انجام شده است.'
  );

}


/* =================================================
   شروع سایت
   ================================================= */

updateCart();


/*
  اتصال به Supabase را در پس‌زمینه انجام می‌دهیم
  تا ظاهر و عملکرد فعلی سایت مختل نشود.
*/

loadProductsFromSupabase();

</script>
