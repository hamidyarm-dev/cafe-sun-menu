/* =====================================================

   مختصات بر اساس تصویر اصلی 1024 × 1536 تنظیم شده
   ===================================================== */

.hotspot{
  position:absolute;
  display:block;

  background:transparent;
  border:0;

  padding:0;
  margin:0;

  cursor:pointer;
  z-index:5;

  -webkit-tap-highlight-color:transparent;
}


/* درخشش هنگام انتخاب */
.hotspot.selected{
  background:rgba(201,150,44,.22);

  border:2px solid rgba(201,150,44,.85);

  box-shadow:
    0 0 8px rgba(201,150,44,.75),
    0 0 18px rgba(201,150,44,.55),
    0 0 30px rgba(201,150,44,.35);

  animation:hotspotGlow 1s ease;
}


/* انیمیشن یک ثانیه‌ای */
@keyframes hotspotGlow{

  0%{
    background:rgba(201,150,44,.05);

    box-shadow:
      0 0 0 rgba(201,150,44,0);
  }

  25%{
    background:rgba(201,150,44,.28);

    box-shadow:
      0 0 12px rgba(201,150,44,.9),
      0 0 25px rgba(201,150,44,.65);
  }

  70%{
    background:rgba(201,150,44,.20);

    box-shadow:
      0 0 10px rgba(201,150,44,.75),
      0 0 22px rgba(201,150,44,.5);
  }

  100%{

<script>

let cart = [];


/* =================================================
   تبدیل عدد به فارسی
   ================================================= */

function faNumber(number){

  return new Intl.NumberFormat('fa-IR')
    .format(number);

}


/* =================================================
   نمایش قیمت
   ================================================= */

function priceText(price){

  return faNumber(price) + ' تومان';

}


/* =================================================
   افکت انتخاب هات اسپات
   ================================================= */

function hotspotEffect(element){

  if(!element){
    return;
  }

  element.classList.remove('selected');

  /*
    برای اینکه اگر کاربر چند بار سریع لمس کرد
    انیمیشن دوباره از اول اجرا شود
  */

  void element.offsetWidth;

  element.classList.add('selected');

  setTimeout(function(){

    element.classList.remove('selected');

  },1000);

}


/* =================================================
   افزودن محصول
   ================================================= */

function addToCart(name,price){

  const existing =
    cart.find(
      item => item.name === name
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:name,
      price:price,
      qty:1

    });

  }


  /*
    تشخیص هات اسپات فعلی که لمس شده
  */

  if(window.event){

    hotspotEffect(window.event.currentTarget);

  }


  updateCart();

  showToast(
    name + ' به سبد اضافه شد ✓'
  );

}


/* =================================================
   تغییر تعداد
   ================================================= */

function changeQty(index,change){

  cart[index].qty += change;


  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  updateCart();

}


/* =================================================
   بروزرسانی سبد
   ================================================= */

function updateCart(){

  const container =
    document.getElementById(
      'cartItems'
    );


  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  document.getElementById(
    'cartCount'
  ).textContent =
    faNumber(count);


  if(cart.length === 0){

    container.innerHTML =
      '<div class="empty-cart">' +
      'سبد سفارش خالی است.' +
      '</div>';


    document.getElementById(
      'cartTotal'
    ).textContent =
      'مجموع: ۰ تومان';


    return;

  }


  container.innerHTML = '';

  let total = 0;


  cart.forEach(
    (item,index)=>{

      total +=
        item.price * item.qty;


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'cart-item';


      row.innerHTML = `

        <div>

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-price">
            ${priceText(item.price)}
          </div>

        </div>


        <div class="quantity">

          <button
            onclick="changeQty(${index},1)">
            +
          </button>

          <span>
            ${faNumber(item.qty)}
          </span>

          <button
            onclick="changeQty(${index},-1)">
            −
          </button>

        </div>

      `;


      container.appendChild(row);

    }
  );


  document.getElementById(
    'cartTotal'
  ).textContent =
    'مجموع: ' +
    priceText(total);

}


/* =================================================
   باز کردن سبد
   ================================================= */

function openCart(){

  updateCart();


  document.getElementById(
    'cartOverlay'
  ).style.display =
    'block';

}


/* =================================================
   بستن سبد
   ================================================= */

function closeCart(){

  document.getElementById(
    'cartOverlay'
  ).style.display =
    'none';

}


/* =================================================
   پیام
   ================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.style.display =
    'block';


  setTimeout(
    ()=>{

      toast.style.display =
        'none';

    },
    1500
  );

}


/* =================================================
   تأیید سفارش
   ================================================= */

function confirmOrder(){

  if(cart.length === 0){

    alert(
      'سبد سفارش خالی است.'
    );

    return;

  }


  alert(
    'سبد سفارش تأیید شد.\n\n' +
    'در مرحله بعد این قسمت را به Supabase وصل می‌کنیم.'
  );

}


/* =================================================
   شروع
   ================================================= */
