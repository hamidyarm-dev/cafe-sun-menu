<head>
<meta charset="utf-8">

<title>منوی کافه خورشید</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f7f1e5;
  font-family:Tahoma,Arial,sans-serif;
}

.menu-page{
  position:relative;
  width:100%;
  max-width:1536px;
  margin:0 auto;
  line-height:0;
}

.menu-image{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

.hotspot{
  position:absolute;
  display:block;
  background:transparent;
  border:0;
  padding:0;
  margin:0;
  cursor:pointer;

}

.hotspot:active{
  background:rgba(201,150,44,.12);
}

/* قهوه گرم */
.espresso{top:9.2%;right:24.0%;width:15%;height:2.8%}
.double{top:10.8%;right:24.0%;width:15%;height:2.8%}
.americano{top:12.6%;right:24.0%;width:15%;height:2.8%}
.cappuccino{top:14.3%;right:24.0%;width:15%;height:2.8%}
.latte{top:16.1%;right:24.0%;width:15%;height:2.8%}
.mocha{top:17.8%;right:24.0%;width:15%;height:2.8%}

/* قهوه سرد */

.ice-latte{top:10.9%;right:3.5%;width:17%;height:2.8%}
.affogato{top:12.7%;right:3.5%;width:17%;height:2.8%}

/* نوشیدنی گرم */
.tea{top:26.2%;right:24.0%;width:15%;height:2.8%}

.masala{top:29.7%;right:24.0%;width:15%;height:2.8%}

/* نوشیدنی سرد */
.lemonade{top:26.2%;right:3.5%;width:17%;height:2.8%}
.mojito{top:27.9%;right:3.5%;width:17%;height:2.8%}
.banana-milk{top:29.7%;right:3.5%;width:17%;height:2.8%}

/* شیک */
.chocolate-shake{top:40.0%;right:78%;width:19%;height:2.8%}
.banana-chocolate-shake{top:42.0%;right:78%;width:19%;height:2.8%}
.nutella-shake{top:44.0%;right:78%;width:19%;height:2.8%}

/* غذا */
.cheeseburger{top:45.8%;right:65.5%;width:14%;height:5%}
.alfredo{top:45.8%;right:42.5%;width:20%;height:5%}
.mushroom-burger{top:45.8%;right:18%;width:16%;height:5%}

/* پیش غذا */
.special-fries{top:52.0%;right:49%;width:19%;height:3%}
.garlic-bread{top:54.0%;right:49%;width:19%;height:3%}

/* سالاد */
.caesar{top:52.0%;right:4%;width:24%;height:3%}

/* کیک و دسر */
.chocolate-cake{top:67.2%;right:76%;width:15%;height:5%}
.cheesecake{top:67.2%;right:57%;width:14%;height:5%}
.tiramisu{top:67.2%;right:39%;width:14%;height:5%}
.brownie{top:67.2%;right:20%;width:15%;height:5%}
.cookie{top:67.2%;right:2%;width:14%;height:5%}


/* سبد خرید */
.cart-button{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:1000;

  border:3px solid #c9962c;
  border-radius:50px;

  background:#06281f;
  color:#fff;

  padding:13px 20px;
  font-family:Tahoma,Arial,sans-serif;
  font-size:16px;
  font-weight:bold;

  box-shadow:0 4px 15px rgba(0,0,0,.3);
  cursor:pointer;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:25px;
  height:25px;

  margin-right:6px;

  border-radius:50%;
  background:#c9962c;
  color:#fff;
}


/* پنجره سبد */
.cart-overlay{
  display:none;

  position:fixed;
  inset:0;

  z-index:2000;

  background:rgba(0,0,0,.65);

  padding:20px;
}

.cart-box{
  width:100%;
  max-width:520px;
  max-height:90vh;

  overflow:auto;

  margin:20px auto;

  background:#fffaf1;

  border:2px solid #c9962c;
  border-radius:20px;

  padding:20px;

  direction:rtl;

  font-family:Tahoma,Arial,sans-serif;
  line-height:1.6;
}

.cart-title{
  text-align:center;
  color:#06281f;
  margin:0 0 15px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  padding:12px 0;

  border-bottom:1px solid #ddd;
}

.cart-item-name{
  font-weight:bold;
}

.cart-item-price{
  font-size:13px;
  color:#555;
}

.quantity{
  display:flex;
  align-items:center;
  gap:7px;
}

.quantity button{
  width:32px;
  height:32px;

  border:0;
  border-radius:8px;

  background:#06281f;
  color:white;

  font-size:18px;
  cursor:pointer;
}

.total{
  text-align:center;

  margin:18px 0;

  color:#06281f;

  font-size:19px;
  font-weight:bold;
}

.cart-actions{
  display:flex;
  gap:10px;
}

.cart-actions button{
  flex:1;

  border:0;
  border-radius:10px;

  padding:13px;

  font-family:Tahoma,Arial,sans-serif;
  font-size:15px;
  font-weight:bold;

  cursor:pointer;
}

.close-cart{
  background:#ddd;
  color:#222;
}

.confirm-cart{
  background:#c9962c;
  color:#fff;
}

.empty-cart{
  text-align:center;
  padding:30px 10px;
  color:#777;
}


/* پیام اضافه شدن */
.toast{
  position:fixed;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);

  z-index:3000;

  background:#06281f;
  color:#fff;

  padding:10px 18px;

  border-radius:10px;

  font-family:Tahoma,Arial,sans-serif;

  display:none;
}


/* روی گوشی */
@media(max-width:600px){

  .cart-button{
    left:10px;
    bottom:10px;
    padding:11px 15px;
    font-size:14px;
  }

  .cart-box{
    margin:5px auto;
    max-height:94vh;
  }

}
</style>
</head>

<body>

  <!-- همان عکس اصلی منوی کافه -->
  <img

    src="file_00000000786081f4974d8223e06752e7.png"
    alt="منوی کافه خورشید"
  >


  <!-- قهوه گرم -->
  <button class="hotspot espresso"
    onclick="addToCart('اسپرسو سینگل',90000)"></button>

  <button class="hotspot double"

  <button class="hotspot americano"
    onclick="addToCart('آمریکانو',120000)"></button>

  <button class="hotspot cappuccino"
    onclick="addToCart('کاپوچینو',140000)"></button>

  <button class="hotspot latte"
    onclick="addToCart('لاته',150000)"></button>

  <button class="hotspot mocha"
    onclick="addToCart('موکا',170000)"></button>


  <!-- قهوه سرد -->
  <button class="hotspot ice-americano"
    onclick="addToCart('آیس آمریکانو',120000)"></button>

  <button class="hotspot ice-latte"

  <button class="hotspot affogato"

  <!-- نوشیدنی گرم -->

  <button class="hotspot herbal"

  <button class="hotspot masala"
    onclick="addToCart('ماسالا',150000)"></button>

  <button class="hotspot hot-chocolate"
    onclick="addToCart('هات چاکلت',160000)"></button>


  <!-- نوشیدنی سرد -->
  <button class="hotspot lemonade"
    onclick="addToCart('لیموناد',150000)"></button>

  <button class="hotspot mojito"
    onclick="addToCart('موهیتو',160000)"></button>

  <button class="hotspot banana-milk"

  <!-- شیک -->
  <button class="hotspot chocolate-shake"

  <button class="hotspot banana-chocolate-shake"
    onclick="addToCart('شیک موز شکلات',210000)"></button>

  <button class="hotspot nutella-shake"

  <!-- غذا -->
  <button class="hotspot cheeseburger"

  <!-- پیش غذا -->
  <button class="hotspot special-fries"
    onclick="addToCart('سیب زمینی مخصوص',175000)"></button>

  <button class="hotspot garlic-bread"

  <!-- سالاد -->
  <button class="hotspot caesar"

  <!-- کیک و دسر -->

  <button class="hotspot cookie"
    onclick="addToCart('کوکی شکلاتی',90000)"></button>

</div>


<!-- دکمه سبد -->
<button class="cart-button" onclick="openCart()">
  🛒 سبد سفارش
  <span class="cart-count" id="cartCount">۰</span>
</button>


<!-- سبد خرید -->
<div class="cart-overlay" id="cartOverlay">

  <div class="cart-box">

    <h2 class="cart-title">🛒 سبد سفارش</h2>

    <div id="cartItems"></div>

    <div class="total" id="cartTotal">
      مجموع: ۰ تومان
    </div>

    <div class="cart-actions">

      <button
        class="close-cart"
        onclick="closeCart()">
        ادامه انتخاب
      </button>

      <button
        class="confirm-cart"
        onclick="confirmOrder()">
        تأیید سفارش
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast">
  به سبد اضافه شد ✓
</div>


<script>

let cart = [];


/* تبدیل عدد به فارسی */
function faNumber(number){

  return new Intl.NumberFormat('fa-IR').format(number);

}


/* نمایش قیمت */
function priceText(price){

  return faNumber(price) + ' تومان';

}


/* افزودن محصول */
function addToCart(name,price){

  const existing =
    cart.find(item => item.name === name);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      name:name,
      price:price,
      qty:1
    });

  }

  updateCart();

  showToast(name + ' به سبد اضافه شد ✓');

}


/* تغییر تعداد */
function changeQty(index,change){

  cart[index].qty += change;

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }

  updateCart();

}


/* بروزرسانی سبد */
function updateCart(){

  const container =
    document.getElementById('cartItems');

  const count =
    cart.reduce(
      (sum,item) => sum + item.qty,
      0
    );

  document.getElementById('cartCount')
    .textContent = faNumber(count);


  if(cart.length === 0){

    container.innerHTML =
      '<div class="empty-cart">سبد سفارش خالی است.</div>';

    document.getElementById('cartTotal')
      .textContent = 'مجموع: ۰ تومان';

    return;

  }


  container.innerHTML = '';

  let total = 0;


  cart.forEach((item,index)=>{

    total += item.price * item.qty;


    const row =
      document.createElement('div');

    row.className = 'cart-item';


    row.innerHTML = `

      <div>

        <div class="cart-item-name">
          ${item.name}
        </div>

        <div class="cart-item-price">
          ${priceText(item.price)}
        </div>

      </div>


      <div class="quantity">

        <button
          onclick="changeQty(${index},1)">
          +
        </button>

        <span>
          ${faNumber(item.qty)}
        </span>

        <button
          onclick="changeQty(${index},-1)">
          −
        </button>

      </div>

    `;


    container.appendChild(row);

  });


  document.getElementById('cartTotal')
    .textContent =
    'مجموع: ' + priceText(total);

}


/* باز کردن سبد */
function openCart(){

  updateCart();

  document.getElementById('cartOverlay')
    .style.display = 'block';

}


/* بستن سبد */
function closeCart(){

  document.getElementById('cartOverlay')
    .style.display = 'none';

}


/* پیام */
function showToast(message){

  const toast =
    document.getElementById('toast');

  toast.textContent = message;

  toast.style.display = 'block';

  setTimeout(()=>{

    toast.style.display = 'none';

  },1500);

}


/* مرحله بعدی پروژه */
function confirmOrder(){

  if(cart.length === 0){

    alert('سبد سفارش خالی است.');

    return;

  }

  alert(
    'سبد سفارش تأیید شد.\\n\\n' +
    'در مرحله بعد این قسمت را به Supabase وصل می‌کنیم.'
  );

}


updateCart();

</script>
